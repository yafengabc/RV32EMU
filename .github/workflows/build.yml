name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      # gui/ builds against Gio, which needs the X11/Wayland/GL headers even
      # for `go vet`; without them ./... stops at the first cgo package.
      - name: Install GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev
      - name: Vet
        run: go vet ./...
      # cpu/mem/perip carry the semantics tests (RunHot vs Step equivalence,
      # C extension, self-modifying code); gui's are pure logic and do not
      # need a display.
      - name: Test
        run: go test ./...

  build:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: rv32emu-linux-amd64,   goos: linux,   goarch: amd64, out: rv32emu }
          - { name: rv32emu-linux-arm64,   goos: linux,   goarch: arm64, out: rv32emu }
          - { name: rv32emu-windows-amd64, goos: windows, goarch: amd64, out: rv32emu.exe }
          - { name: rv32emu-darwin-arm64,  goos: darwin,  goarch: arm64, out: rv32emu }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      # The CLI only: the gui/ package needs cgo and a display stack, and the
      # emulator itself is what these artifacts are for.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/${{ matrix.out }}" .
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rv32emu-*
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # download-artifact puts each artifact in its own subdirectory
          mkdir -p assets
          find dist -type f -exec cp {} assets/ \;
          ls -l assets
          gh release create "$TAG" assets/* \
            --title "RV32EMU $TAG" \
            --generate-notes
